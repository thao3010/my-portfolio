
name: Deploy to AWS EC2

'on':
  workflow_run:
    workflows:
      - Build Docker Images
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify latest main commit
        id: verify
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          LATEST_SHA=$(gh api "repos/$REPOSITORY/branches/main" \
            --jq '.commit.sha')

          if [ "$IMAGE_TAG" != "$LATEST_SHA" ]; then
            echo "A newer commit exists. Skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.verify.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Send deploy command to EC2
        if: steps.verify.outputs.deploy == 'true'
        id: send
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -nc \
              --arg sha "$IMAGE_TAG" \
              '{commands:[
                "set -eu",
                "cd /home/ubuntu/my-portfolio",
                "runuser -u ubuntu -- git fetch origin main",
                ("CURRENT=$(runuser -u ubuntu -- git rev-parse origin/main); if [ \"$CURRENT\" != \"" + $sha + "\" ]; then echo \"Skipping outdated deploy\"; exit 0; fi"),
                ("runuser -u ubuntu -- git merge --ff-only " + $sha),
                ("runuser -u ubuntu -- bash scripts/deploy.sh " + $sha)
              ]}')" \
            --comment "Deploy My Portfolio" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        if: steps.verify.outputs.deploy == 'true'
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
