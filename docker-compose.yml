services:
  postgres:
    image: postgres:16
    container_name: portfolio-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - portfolio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    profiles: ['storage']
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: portfolio-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - portfolio_minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - '3847:3847'
    environment:
      NODE_ENV: production
      PORT: 3847
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: portfolio
      DATABASE_PASSWORD: portfolio
      DATABASE_NAME: portfolio
      API_PUBLIC_URL: http://localhost:3847
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long!!
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars-long!
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - portfolio_api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3847/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        VITE_API_URL: http://localhost:3847
        VITE_WEB_URL: http://localhost:3000
    container_name: portfolio-cms
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3847
        NEXT_PUBLIC_CMS_URL: http://localhost:5173
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      API_INTERNAL_URL: http://api:3847
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

volumes:
  portfolio_pg_data:
  portfolio_minio_data:
  portfolio_api_uploads:
